<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indus Trader</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#171717;color:#fff;font:16px system-ui,sans-serif}body{display:flex;flex-direction:column}#game{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}ruffle-player{width:100%;height:100%}#error{padding:20px;max-width:650px;margin:auto}a{color:#a8d8ff}
</style>
<script>
window.RufflePlayer=window.RufflePlayer||{};
window.addEventListener('DOMContentLoaded',async()=>{
 try{
 const ruffle=window.RufflePlayer.newest();
 const player=ruffle.createPlayer();
 document.getElementById('game').appendChild(player);
 await player.ruffle().load({url:'indus_valley.swf',allowScriptAccess:false});
 }catch(error){document.getElementById('game').textContent='Unable to start the game. Check that Ruffle and the game files are accessible.';console.error(error);}
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.4.1/ruffle.js"></script>
</head>
<body><main id="game" aria-label="Indus Trader game"></main></body>
</html>
